<!doctype html>
<html lang="de"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bilder für die README (Beispieldaten)</title>

<!-- Quelle der README-Bilder. Aufruf: quelle.html#<seite>-<hell|dunkel>. Seiten: start, uebersicht, raster, liste, auswahl, dokumente, einfuegen, vompc, vompcauswahl, entpacken, umbenennen, loeschen, analyse, papierkorb, sortieren, zweifenster.
     Rendern: google-chrome --headless --screenshot=OUT.png --window-size=360,740 --force-device-scale-factor=2 "file:///…/quelle.html#liste-hell" -->
<style>
:root{--font:Roboto,"Noto Sans","DejaVu Sans",system-ui,sans-serif}
html,body{margin:0;padding:0;font-family:var(--font);letter-spacing:.02em}
body.hell{--bg:#F4F6F2;--sf:#FFFFFF;--tx:#1C211A;--dm:#566052;--ln:#D9DDD5;--pr:#3F8A21;--bar:#3F8A21;--sb:#2F6E18;--fo:#6AA84F;--ic:#4D5649;--ch:#E3EFD9}
body.dunkel{--bg:#161815;--sf:#1F211D;--tx:#F2F5EE;--dm:#B9C4B2;--ln:#33382F;--pr:#7ED648;--bar:#2E7D18;--sb:#245F12;--fo:#86C854;--ic:#D0DAC8;--ch:#24421A}
body{background:var(--bg);color:var(--tx);width:360px;height:740px;overflow:hidden;display:flex;flex-direction:column}
.app{background:var(--bar);color:#fff;height:48px;display:flex;align-items:center;gap:10px;padding:0 6px 0 14px;flex:none}
.app img{width:32px;height:36px}.app b{font-size:16px;font-weight:500;display:block;line-height:1.15}.app small{font-size:11px;opacity:.88;line-height:1.1}
.app .set{margin-left:auto;width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:24px}
.top{background:var(--sf);border-bottom:1px solid var(--ln);height:52px;display:flex;align-items:center;gap:2px;padding:0 4px 0 8px;font-size:18px;font-weight:500;flex:none}
.top span{flex:1;padding-left:4px}.top i{font-size:24px;padding:10px;color:var(--ic)}
.sel{background:var(--sb);color:#fff;height:52px;display:flex;align-items:center;gap:2px;padding:0 4px 0 8px;font-size:16px;font-weight:500;flex:none}
.sel span{flex:1;padding-left:4px;white-space:nowrap}.sel i{font-size:24px;padding:10px}
.search{background:var(--bg);height:44px;display:flex;align-items:center;gap:10px;padding:0 8px 0 16px;color:var(--dm);font-size:15px;border-bottom:1px solid var(--ln);flex:none}
.search i:last-child{margin-left:auto;padding:6px}
.path{background:var(--bg);height:44px;display:flex;align-items:center;padding:0 16px 0 8px;font-size:14px;color:var(--dm);border-bottom:1px solid var(--ln);flex:none}
.path i{font-size:22px;color:var(--pr);padding:10px}.path b{color:var(--pr);font-weight:500;margin-left:6px}.path em{font-style:normal;margin-left:8px}
.tabs{display:flex;background:var(--bg);border-bottom:1px solid var(--ln);font-size:15px;flex:none;overflow:hidden}
.tabs div{padding:12px 16px 10px;color:var(--dm);border-bottom:3px solid transparent;white-space:nowrap}
.tabs .on{color:var(--pr);font-weight:500;border-color:var(--pr)}
.body{flex:1;overflow:hidden;background:var(--sf)}
.pad{padding:16px;display:flex;flex-direction:column;gap:12px;background:var(--bg);height:100%;box-sizing:border-box}
.r{display:flex;align-items:center;gap:14px;height:60px;padding:0 4px 0 14px;border-bottom:1px solid var(--ln);box-sizing:border-box}
.r.on{background:var(--ch)}
.r .ico{width:36px;height:36px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--ic);flex:none}
.r .ico.fo{color:var(--fo)}
.r .ico.th{border-radius:4px;overflow:hidden}
.r .x{flex:1;min-width:0}.t{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.s{font-size:12px;color:var(--dm);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .mo{font-size:22px;color:var(--dm);padding:13px}
.cb{width:18px;height:18px;border:2px solid var(--dm);border-radius:3px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:13px}
.cb.on{background:var(--pr);border-color:var(--pr)}
body.dunkel .cb.on{color:#10200A}
.nav{display:flex;border-top:1px solid var(--ln);background:var(--sf);flex:none;height:64px}
.nav div{flex:1;text-align:center;padding-top:8px;font-size:12px;color:var(--dm)}.nav div i{display:block;font-size:24px}.nav .on{color:var(--pr);font-weight:500}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:16px}
.grp,.card,.mini,.two{flex:none}.card h3{margin:0;font-size:20px;font-weight:500}.card p{margin:2px 0 0;font-size:14px;color:var(--dm)}
.head{display:flex;gap:16px;align-items:center}.badge{width:64px;height:64px;border-radius:12px;background:var(--pr);color:#fff;display:flex;align-items:center;justify-content:center;font-size:32px}
body.dunkel .badge{color:#10200A}
.btn{margin-top:12px;border:1.5px solid var(--pr);color:var(--pr);border-radius:8px;text-align:center;padding:13px;font-size:15px;font-weight:500}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mini{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px}
.mini .b2{width:48px;height:48px;border-radius:10px;background:var(--ch);color:var(--pr);display:flex;align-items:center;justify-content:center;font-size:24px}
.mini b{display:block;margin-top:14px;font-size:18px;font-weight:500}.mini small{font-size:13px;color:var(--dm)}
.sec{font-size:13px;font-weight:500;color:var(--dm);padding:6px 4px 0}
.grp{background:var(--sf);border:1px solid var(--ln);border-radius:10px;overflow:hidden}
.vol{padding:12px 16px}.bar{height:6px;border-radius:3px;background:var(--ln);margin:10px 0 0 40px}.bar i{display:block;height:6px;border-radius:3px;background:var(--pr)}
.vt{display:flex;align-items:center;gap:16px}.vt .pc{margin-left:auto;color:var(--pr);font-weight:500;font-size:14px}
.recent .r{border:0;height:52px;padding-left:0}.recent .r>i{font-size:22px;color:var(--pr);width:28px}.recent .ico{font-size:22px;color:var(--pr);width:28px}
.bt{display:flex;align-items:center;justify-content:center;height:44px;min-width:112px;padding:0 16px;box-sizing:border-box;border-radius:8px;font-size:14px;font-weight:500;border:1.5px solid var(--pr);color:var(--pr);white-space:nowrap}
.bt.f{background:var(--pr);color:#fff}body.dunkel .bt.f{color:#10200A}
.paste{display:flex;align-items:center;gap:8px;padding:8px 16px;background:var(--sf);border-top:1px solid var(--ln);flex:none}
.paste span{flex:1;font-size:14px;font-weight:500}
.stor{display:flex;background:var(--bg);border-bottom:1px solid var(--ln);flex:none;padding:0 8px;font-size:14px}
.stor div{flex:1;text-align:center;padding:10px 8px 8px;color:var(--dm);border-bottom:3px solid transparent}.stor .on{color:var(--pr);font-weight:500;border-color:var(--pr)}
.actions{display:flex;justify-content:flex-end;gap:8px;padding:2px 16px 8px;background:var(--bg);flex:none}
.cap{font-size:12px;color:var(--dm);text-align:center;padding:6px}

.seg{display:flex;height:14px;border-radius:7px;overflow:hidden;margin:12px 0 10px;gap:2px;background:var(--ln)}.seg i{display:block;height:14px}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13px}.leg div{display:flex;align-items:center;gap:8px;white-space:nowrap}.leg em{width:10px;height:10px;border-radius:2px;flex:none}.leg b{margin-left:auto;font-weight:500}
.big{font-size:22px;font-weight:500}
.rb{height:4px;border-radius:2px;background:var(--ln);margin-top:5px}.rb i{display:block;height:4px;border-radius:2px;background:var(--pr)}
.dlgwrap{position:absolute;left:0;right:0;top:48px;bottom:0;background:rgba(0,0,0,.45);display:flex}
.dlg{margin:auto 20px;background:var(--sf);border-radius:16px;padding:22px 22px 14px;box-shadow:0 8px 30px rgba(0,0,0,.35);width:100%}
.dlg h3{margin:0 0 10px;font-size:20px;font-weight:500}.dlg p{margin:0;font-size:15px;line-height:1.45;color:var(--dm)}
.dlg .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.note{padding:12px 14px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);font-size:13px;color:var(--dm);line-height:1.45}
.rtabs{display:flex;font-size:13px;margin:6px 0 8px}.rtabs div{flex:1;text-align:center;padding:8px 2px 7px;color:var(--dm);border-bottom:3px solid transparent;white-space:nowrap}.rtabs .on{color:var(--pr);font-weight:500;border-color:var(--pr)}
.fld{border-bottom:1.5px solid var(--ln);padding:8px 0 6px;font-size:15px;margin-bottom:4px}.flb{font-size:12px;color:var(--dm);margin-top:6px}
.prev{border:1px solid var(--ln);border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.6;margin-top:10px;background:var(--bg)}.prev i{font-style:normal;color:var(--dm);padding:0 6px}

.rd{width:18px;height:18px;border:2px solid var(--dm);border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center}.rd.on{border-color:var(--pr)}.rd.on:after{content:"";width:10px;height:10px;border-radius:50%;background:var(--pr)}
.opt{display:flex;align-items:center;gap:14px;font-size:15px;padding:9px 0}.sh{font-size:12px;font-weight:500;color:var(--dm);margin:10px 0 2px}
.pane{flex:1;display:flex;flex-direction:column;min-height:0;overflow:hidden;border-bottom:3px solid var(--ln)}
.pane .ph{display:flex;align-items:center;gap:8px;height:38px;padding:0 16px;font-size:13px;color:var(--dm);background:var(--bg);border-bottom:1px solid var(--ln);flex:none}.pane .ph b{color:var(--pr);font-weight:500}
.pane .r{height:54px}

.sheet{position:absolute;left:0;right:0;bottom:0;background:var(--sf);border-radius:16px 16px 0 0;padding:6px 0 14px;box-shadow:0 -6px 24px rgba(0,0,0,.35)}
.sheet .sh2{font-size:14px;font-weight:500;color:var(--pr);padding:14px 20px 4px}
.sheet .ch{display:flex}.sheet .ch>div{flex:1;display:flex;align-items:center;gap:6px;height:52px;padding-left:16px}.sheet .ch i{font-size:26px}
.sheet .sr{padding:12px 20px;font-size:17px}
.sheet .cr{display:flex;align-items:center;padding:12px 14px 12px 20px;font-size:16px}.sheet .cr span{flex:1}
.sheet .bx{width:20px;height:20px;border:2px solid var(--dm);border-radius:3px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff}.sheet .bx.on{background:var(--pr);border-color:var(--pr)}
body.dunkel .sheet .bx.on{color:#10200A}
.sheet .rs{padding:12px 20px 4px;font-size:14px;font-weight:500;color:var(--pr)}
.pm{display:flex;align-items:center;gap:6px;height:44px;padding:0 6px 0 8px;font-size:14px;color:var(--dm);background:var(--bg);border-bottom:1px solid var(--ln);flex:none}
.pm .tag{padding:2px 8px;border-radius:10px;border:1px solid var(--ln);font-size:12px;font-weight:500;background:var(--sf)}.pm .tag.on{background:var(--pr);border-color:var(--pr);color:#fff}body.dunkel .pm .tag.on{color:#10200A}
.pm i{font-size:22px;color:var(--pr);padding:6px}.pm b{color:var(--pr);font-weight:500}.pm .mn{margin-left:auto;color:var(--ic);font-size:24px}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:6px 6px;background:var(--sf);align-content:start}
.tl{text-align:center;padding:2px}
.tl .ib{aspect-ratio:1;display:flex;align-items:center;justify-content:center;padding:10px;box-sizing:border-box}
.tl .ib i{font-size:60px;color:var(--ic);line-height:1}.tl .ib i.fo{color:var(--fo)}
.tl .ib div{width:100%;height:100%;border-radius:8px}
.tl .nm{font-size:12px;line-height:1.25;height:30px;overflow:hidden;word-break:break-word}
</style></head>
<body><div id="root" style="display:contents"></div>
<script>
const h=(location.hash||'#start-hell').slice(1).split('-');const page=h[0],theme=h[1]||'hell';
document.body.className=theme;
const ic=n=>`<i class="ti ti-${n}"></i>`;
const nav=a=>`<div class="nav">${[['home','Start'],['download','Vom PC'],['upload','Zum PC'],['history','Verlauf']].map((x,i)=>`<div class="${i==a?'on':''}">${ic(x[0])}${x[1]}</div>`).join('')}</div>`;
const app=`<div class="app"><img src="../../res/drawable-nodpi/logo_phone.png" alt=""><div><b>Nolphin Handy</b><small>Verbunden mit Mein-Laptop</small></div><div class="set">${ic('menu-2')}</div></div>`;
const row=(i,t,s,o={})=>`<div class="r ${o.on?'on':''}">${o.cb!==undefined?`<div class="cb ${o.cb?'on':''}">${o.cb?'✓':''}</div>`:''}<div class="ico ${o.fo?'fo':''} ${o.th?'th':''}">${o.th?`<div style="width:36px;height:36px;background:linear-gradient(135deg,${o.th})"></div>`:ic(i)}</div><div class="x"><div class="t">${t}</div><div class="s">${s}</div></div>${o.more===false?'':`<div class="mo">${ic('dots-vertical')}</div>`}</div>`;
const F=(t,s,o={})=>row('folder-filled',t,s,{fo:1,...o});
const T=(i,n,o={})=>`<div class="tl"><div class="ib">${o.th?`<div style="background:linear-gradient(135deg,${o.th})"></div>`:`<i class="ti ti-${i}${o.fo?' fo':''}"></i>`}</div><div class="nm">${n}</div></div>`;
const TF=n=>T('folder-filled',n,{fo:1});
let html='';
if(page==='start'){html=app+`<div class="body"><div class="pad">
<div class="card"><div class="head"><div class="badge">${ic('device-mobile')}</div><div><h3>Verbunden</h3><p>PC: Mein-Laptop</p><p style="font-size:13px;letter-spacing:.06em">192.168.1.20:40000</p></div></div><div class="btn">Verbindung trennen</div></div>
<div class="two"><div class="mini"><div class="b2">${ic('download')}</div><b>Vom PC</b><small>Noch nichts da</small></div><div class="mini"><div class="b2">${ic('upload')}</div><b>Zum PC</b><small>Fotos und Dateien senden</small></div></div>
<div class="card recent"><h3 style="font-size:18px;margin-bottom:8px">Zuletzt</h3>
<div class="r">${ic('upload')}<div class="x"><div class="t">Urlaub_001.jpg</div><div class="s">11:14</div></div></div>
<div class="r">${ic('download')}<div class="x"><div class="t">Rechnung_Oktober.pdf</div><div class="s">11.10. 20:50</div></div></div>
<div class="r">${ic('upload')}<div class="x"><div class="t">Notizen.txt</div><div class="s">11.10. 20:37</div></div></div><div class="btn" style="margin-top:6px">Alle anzeigen</div></div>
</div></div>`+nav(0);}
if(page==='uebersicht'){html=app+`<div class="body"><div class="pad" style="padding-top:8px">
<div class="sec">SPEICHER</div><div class="grp"><div class="vol"><div class="vt">${ic('device-mobile')}<div><div style="font-size:16px;font-weight:500">Hauptspeicher</div><div class="s">74 GB von 128 GB belegt</div></div><div class="pc">58 %</div></div><div class="bar"><i style="width:58%"></i></div></div>
<div class="vol" style="border-top:1px solid var(--ln)"><div class="vt">${ic('database')}<div><div style="font-size:16px;font-weight:500">SD-Karte</div><div class="s">7 GB von 60 GB belegt</div></div><div class="pc">12 %</div></div><div class="bar"><i style="width:12%"></i></div></div></div>
<div class="sec">SCHNELLZUGRIFF</div><div class="grp">${row('download','Downloads','12 Elemente',{more:false})}${row('apps','Apps','1 App',{more:false})}${row('photo','Google Fotos','Fotos und Videos aus der Cloud',{more:false})}${row('cloud','Cloud und andere Apps','Google Drive und Dateien anderer Apps',{more:false})}</div>
<div class="sec">KATEGORIEN</div><div class="grp">${row('photo','Bilder','120 MB · 83 Dateien',{more:false})}${row('music','Audio','12 GB · 2437 Dateien',{more:false})}${row('file-text','Dokumente','31 MB · 17 Dateien',{more:false})}</div>
</div></div>`+nav(2);}
if(page==='raster'){html=app+`<div class="path">${ic('home')}<span>›</span><em>Speicher</em><em>›</em><b>Dokumente</b></div><div class="body"><div class="g4">${TF('Steuer 2025')}${TF('Versicherungen')}${T('photo','Urlaub_001.jpg',{th:'#9CC6E8,#4C79A8'})}${T('photo','Urlaub_002.jpg',{th:'#E8C79C,#A8794C'})}${T('file-type-pdf','Rechnung_Oktober.pdf')}${T('file-text','Brief Finanzamt.docx')}${T('table','Haushalt 2026.xlsx')}${T('photo','Strand.jpg',{th:'#A8D8B0,#4C8E5A'})}${T('file-zip','Sicherung.zip')}${T('box','Zahnrad.step')}${T('music','Lied.mp3')}${T('photo','Garten.jpg',{th:'#C6E0A0,#6C9A3C'})}</div></div>`+nav(2);}
if(page==='liste'){html=app+`<div class="path">${ic('home')}<span>›</span><em>Speicher</em><em>›</em><b>Dokumente</b></div><div class="body">
${F('Steuer 2025','14 Elemente')}${F('Versicherungen','6 Elemente')}${row('file-type-pdf','Rechnung_Oktober.pdf','214 KB · 12.10.2026')}${row('file-text','Brief Finanzamt.docx','48 KB · 10.10.2026')}${row('table','Haushalt 2026.xlsx','96 KB · 03.10.2026')}${row('photo','Urlaub_001.jpg','3,2 MB · 01.10.2026',{th:'#8DB6D9,#3E6B8E'})}${row('file-zip','Sicherung.zip','128 MB · 28.09.2026')}${row('box','Zahnrad.step','201 KB · 11.10.2026')}</div>`+nav(2);}
if(page==='auswahl'){html=app+`<div class="sel">${ic('x')}<span>3 gewählt</span>${ic('upload')}${ic('copy')}${ic('arrows-move')}${ic('trash')}${ic('dots-vertical')}</div><div class="search">${ic('search')}Auf dem Handy suchen${ic('x')}</div><div class="body">
${row('folder-filled','Steuer 2025','14 Elemente',{fo:1,cb:1,on:1,more:false})}${row('folder-filled','Versicherungen','6 Elemente',{fo:1,cb:0,more:false})}${row('file-type-pdf','Rechnung_Oktober.pdf','214 KB · 12.10.2026',{cb:1,on:1,more:false})}${row('file-text','Brief Finanzamt.docx','48 KB · 10.10.2026',{cb:0,more:false})}${row('table','Haushalt 2026.xlsx','96 KB · 03.10.2026',{cb:1,on:1,more:false})}${row('photo','Urlaub_001.jpg','3,2 MB · 01.10.2026',{cb:0,more:false,th:'#8DB6D9,#3E6B8E'})}${row('file-zip','Sicherung.zip','128 MB · 28.09.2026',{cb:0,more:false})}</div>`+nav(2);}
if(page==='dokumente'){html=app+`<div class="path">${ic('home')}<span>›</span><b>Dokumente</b></div><div class="tabs"><div>Alle</div><div>DOC</div><div>XLS</div><div class="on">PDF</div><div>PPT</div><div>Sonstige</div></div><div class="stor"><div class="on">Beides</div><div>Intern</div><div>SD-Karte</div></div><div class="body">
${row('file-type-pdf','Rechnung_Oktober.pdf','Download · 214 KB · 12.10.2026')}${row('file-type-pdf','Vertrag Wohnung.pdf','Documents · 1,2 MB · 02.10.2026')}${row('file-type-pdf','Bedienungsanleitung.pdf','SD-Karte · Download · 3,4 MB · 28.09.2026')}${row('file-type-pdf','Fahrplan.pdf','Download · 180 KB · 20.09.2026')}</div>`+nav(2);}
if(page==='vompc'){html=app+`<div class="top"><span>Vom PC</span>${ic('layout-grid')}</div><div class="search" style="padding-left:16px">${ic('search')}Auf dem PC suchen${ic('x')}</div><div class="path">${ic('home')}<span>›</span><b>Handy</b></div><div class="actions"><div class="bt">Auswählen</div><div class="bt f">Alle laden</div></div><div class="body">
${row('file-type-pdf','Angebot Maler.pdf','214 KB  ·  auf dem Handy',{more:false})}${row('table','Haushalt 2026.xlsx','96 KB  ·  noch nicht geladen',{more:false})}${row('photo','Plan.png','1,1 MB  ·  noch nicht geladen',{more:false,th:'#D9B98D,#8E6A3E'})}${row('folder-filled','Urlaub','Ordner',{fo:1,more:false})}</div>`+nav(1);}
if(page==='einfuegen'){html=app+`<div class="path">${ic('home')}<span>›</span><em>Speicher</em><em>›</em><em>Download</em><em>›</em><b>Ziel</b></div><div class="body">
